<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam-Fix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><h1>Beam-Fix</h1><span>Damaged glulam beam: plate repair</span></div>
  <div class="tools">
    <button id="btnTheme" aria-label="Switch between light and dark">Dark</button>
    <button id="btnLink" aria-label="Copy a link to this exact setup">Share</button>
    <button id="btnReset" aria-label="Reset all inputs">Reset</button>
  </div>
</header>
<div id="sumbar" class="sumbar" aria-live="polite"></div>
<main>
  <section id="visuals">
    <div id="notes"></div>
    <div class="panel"><div class="ph"><h2>Beam</h2><div id="segCheck" class="seg"></div></div><div id="elev"></div></div>
    <div class="panel"><h2>Sag along the span</h2><div id="defl"></div></div>
    <div class="panel"><div class="ph"><h2>Stress map</h2><div id="segStress" class="seg"></div></div><div id="stress"></div></div>
    <div class="panel"><h2>Twist</h2><div id="twist"></div></div>
  </section>
  <section id="controls"></section>
  <section id="details"></section>
</main>
<footer>Source &amp; validation: <a href="https://github.com/jtdyal/Beam-Fix">github.com/jtdyal/Beam-Fix</a></footer>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
